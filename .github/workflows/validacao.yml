name: Validação dos números

on:
  push:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install pandas openpyxl
      - name: Conferir respostas do case com o dashboard
        run: python validacao/validacao.py
      - name: Gerar proposta de metas 2019
        run: python validacao/proposta_metas_2019.py
